version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aura-postgres
    restart: always
    environment:
      POSTGRES_DB: aura_prod
      POSTGRES_USER: aura_admin
      POSTGRES_PASSWORD: aura_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_admin -d aura_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://aura_admin:aura_secure_password_2026@postgres:5432/aura_prod?schema=public"
      JWT_SECRET: "aura_super_secret_jwt_access_key_2026_production"
      JWT_REFRESH_SECRET: "aura_super_secret_jwt_refresh_key_2026_production"
      FRONTEND_URL: "http://localhost:3000"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://localhost:11434}"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aura-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
